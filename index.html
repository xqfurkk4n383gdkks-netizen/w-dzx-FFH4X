<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEDZX Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #030105;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Yoğunlaştırılmış Kırmızı ve Mor Hareketli Ağ Canvas Alanı */
        #webCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 380px;
            padding: 20px;
            z-index: 1;
        }

        .panel-card {
            background: rgba(12, 3, 18, 0.88);
            border: 2px solid #9900ff;
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 0 35px rgba(153, 0, 255, 0.5), 0 0 15px rgba(255, 0, 51, 0.4), inset 0 0 20px rgba(153, 0, 255, 0.25);
            backdrop-filter: blur(8px);
        }

        .panel-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #ffffff;
            margin-bottom: 8px;
            text-shadow: 0 0 12px rgba(255, 0, 51, 0.9), 0 0 20px rgba(153, 0, 255, 0.8);
        }

        .panel-subtitle {
            font-size: 11px;
            color: #cc66ff;
            letter-spacing: 1px;
            margin-bottom: 25px;
            text-transform: uppercase;
            text-shadow: 0 0 6px rgba(153, 0, 255, 0.7);
        }

        .feature-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .feature-btn {
            background: rgba(20, 5, 30, 0.85);
            border: 1px solid rgba(153, 0, 255, 0.4);
            border-radius: 10px;
            padding: 12px 15px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .feature-btn:active {
            transform: scale(0.97);
        }

        .feature-btn.active {
            border-color: #ff0033;
            background: rgba(153, 0, 255, 0.15);
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.3), 0 0 10px rgba(153, 0, 255, 0.3);
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .inject-btn {
            background: linear-gradient(135deg, #ff0033, #9900ff);
            border: none;
            border-radius: 10px;
            padding: 14px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 18px rgba(153, 0, 255, 0.5), 0 4px 18px rgba(255, 0, 51, 0.5);
            transition: all 0.2s ease;
        }

        .game-launch-btn {
            background: linear-gradient(135deg, #cc00ff, #ff0033);
            border: none;
            border-radius: 10px;
            padding: 14px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 18px rgba(204, 0, 255, 0.5), 0 4px 18px rgba(255, 0, 51, 0.5);
            transition: all 0.2s ease;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .inject-btn:active, .game-launch-btn:active {
            transform: scale(0.97);
        }

        .status-text {
            margin-top: 15px;
            font-size: 12px;
            color: #d1b3ff;
            min-height: 18px;
            text-shadow: 0 0 5px rgba(153, 0, 255, 0.4);
        }
    </style>
</head>
<body>

    <!-- Yoğunlaştırılmış Kırmızı ve Mor Hareketli Ağ Efekti -->
    <canvas id="webCanvas"></canvas>

    <div class="container">
        <div class="panel-card">
            <div class="panel-title">WEDZX</div>
            <div class="panel-subtitle">Wedzx Panel Aktif</div>

            <div class="feature-list">
                <button class="feature-btn active" onclick="toggleFeature(this, 'AIMBOT')">
                    🎯 AIMBOT: <span class="state">ON</span>
                </button>
                <button class="feature-btn active" onclick="toggleFeature(this, 'ESP')">
                    👁️ ESP: <span class="state">ON</span>
                </button>
                <button class="feature-btn active" onclick="toggleFeature(this, 'AIM LOCK')">
                    🔒 AIM LOCK: <span class="state">ON</span>
                </button>
                <button class="feature-btn active" onclick="toggleFeature(this, 'BACK JUMP')">
                    🦘 BACK JUMP: <span class="state">ON</span>
                </button>
                <button class="feature-btn" onclick="toggleFeature(this, 'SPEED AIM')">
                    ⚡ SPEED AIM: <span class="state">OFF</span>
                </button>
                <button class="feature-btn" onclick="toggleFeature(this, 'NO RECOIL')">
                    🔫 NO RECOIL: <span class="state">OFF</span>
                </button>
            </div>

            <div class="action-buttons">
                <button class="inject-btn" onclick="startInject()">
                    💉 INJECT
                </button>
                
                <a href="freefireth://" class="game-launch-btn">
                    🔥 FREE FIRE BAŞLAT
                </a>
            </div>

            <div class="status-text" id="statusText"></div>
        </div>
    </div>

    <script>
        function toggleFeature(button, name) {
            const stateSpan = button.querySelector('.state');
            if (button.classList.contains('active')) {
                button.classList.remove('active');
                stateSpan.textContent = 'OFF';
            } else {
                button.classList.add('active');
                stateSpan.textContent = 'ON';
            }
        }

        function startInject() {
            const statusText = document.getElementById('statusText');
            statusText.textContent = "Bağlantı kuruluyor...";
            
            setTimeout(() => {
                statusText.textContent = "Dosyalar yükleniyor...";
            }, 800);

            setTimeout(() => {
                statusText.textContent = "Demo Inject tamamlandı.";
            }, 1800);
        }

        // Optimize Edilmiş Yoğun Ağ Animasyon Motoru
        const canvas = document.getElementById('webCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let particles = [];
        // Performansı düşürmeden ağı artırmak için ideal sayıya ayarlandı
        const particleCount = 85;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.5,
                radius: Math.random() * 2 + 1.2,
                color: Math.random() > 0.5 ? '#ff0033' : '#9900ff'
            });
        }

        function animateWebs() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let distance = Math.hypot(p.x - p2.x, p.y - p2.y);

                    // Bağlantı mesafesi artırılarak ağların sıklaşması sağlandı
                    if (distance < 110) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        let alpha = (1 - (distance / 110)) * 0.45;
                        
                        ctx.strokeStyle = p.color === '#ff0033' && p2.color === '#ff0033' 
                            ? `rgba(255, 0, 51, ${alpha})` 
                            : (p.color === '#9900ff' && p2.color === '#9900ff' 
                                ? `rgba(153, 0, 255, ${alpha})` 
                                : `rgba(204, 0, 128, ${alpha})`);

                        ctx.lineWidth = 0.7;
                        ctx.shadowBlur = 4;
                        ctx.shadowColor = "#9900ff";
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animateWebs);
        }

        animateWebs();
    </script>

</body>
</html>
